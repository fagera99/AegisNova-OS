#!/usr/sbin/nft -f
# ═══════════════════════════════════════════════════════════
# AegisNova OS — Default-Deny nftables Firewall
# ═══════════════════════════════════════════════════════════

flush ruleset

table inet filter {
    # ── Allowed service ports ──
    set ai_agent_ports {
        type inet_service
        elements = {
            8080,   # llama.cpp / AI Shell
            8081,   # LLM proxy (Docker)
            8888,   # Jupyter Lab
            9090,   # Red-Team Results UI
            5601,   # Kibana
            9200,   # Elasticsearch
            55000,  # Wazuh API
        }
    }

    set management_ports {
        type inet_service
        elements = {
            22,     # SSH (key-only)
            9090,   # Cockpit (if installed)
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Accept established/related
        ct state established,related accept
        ct state invalid drop

        # Loopback
        iif "lo" accept

        # ICMP (limited)
        ip protocol icmp icmp type { echo-request } limit rate 5/second accept
        ip6 nexthdr icmpv6 accept

        # SSH (rate limited)
        tcp dport @management_ports ct state new limit rate 3/minute accept

        # AI agent ports (localhost only by default)
        iif "lo" tcp dport @ai_agent_ports accept

        # APT/DNS (outbound responses)
        udp sport 53 accept
        tcp sport { 80, 443 } accept

        # Log and drop everything else
        log prefix "[nft-DROP] " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Docker bridge forwarding
        iifname "docker0" accept
        oifname "docker0" accept
        iifname "br-*" accept
        oifname "br-*" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Allow all outbound (adjust for strict environments)
        ct state established,related accept
        ct state new accept
    }
}
