# ═══════════════════════════════════════════════════════════
# AegisNova OS — Hardened SSH Configuration
# ═══════════════════════════════════════════════════════════

# Disable password authentication
PasswordAuthentication no
ChallengeResponseAuthentication no

# Key-based auth only
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# Disable root login
PermitRootLogin prohibit-password

# Protocol hardening
Protocol 2
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Session limits
MaxAuthTries 3
MaxSessions 5
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30

# Logging
LogLevel VERBOSE
SyslogFacility AUTH

# Misc hardening
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
PrintMotd yes
Banner /etc/ssh/banner

# MFA via Google Authenticator (requires pam setup)
# AuthenticationMethods publickey,keyboard-interactive
